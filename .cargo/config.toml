# TypeScript types of the API for the web: `cargo test` writes them with ts-rs
# (each type marked `#[ts(export)]`); CI fails when the committed ones are stale.
[env]
TS_RS_EXPORT_DIR = { value = "web/src/shared/api/generated", relative = true }
TS_RS_IMPORT_EXTENSION = "ts"
TS_RS_LARGE_INT = "number"
