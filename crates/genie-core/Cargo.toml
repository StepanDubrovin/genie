[package]
name = "genie-core"
description = "Genie domain core: task tracker, role workflow, event journal (SQLite)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cron = "0.17.0"
getrandom = "0.4.3"
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
